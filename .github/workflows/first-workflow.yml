name: My First CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  hello-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Print Message
        run: echo "Hello Aman! Welcome to CI/CD 🚀"

      - name: Show Current Directory
        run: pwd

      - name: List Files
        run: ls -la